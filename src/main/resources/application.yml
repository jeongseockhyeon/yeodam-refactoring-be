server:
  port: 8080


spring:
  datasource:
    url: ${ DB_URL }
    username: ${ DB_USERNAME }
    password: ${ DB_PASSWORD }

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  mvc:
    hiddenmethod:
      filter:
        enabled: true


  cloud:
    aws:
      credentials:
        accessKey: ${ S3_ACCESS_KEY }
        secretKey: ${ S3_SECRET_KEY }
      s3:
        bucket: ${ S3_BUCKET_NAME }
      region:
        static: ${ S3_REGION }
      stack:
        auto: false
      cloudfront:
        domainName: ${ CLOUDFRONT_DOMAIN_NAME }

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 500MB

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

imp:
  store-key: ${ IMP_STORE_KEY }
  api-key: ${ IMP_API_KEY }
  secret-key: ${ IMP_SECRET_KEY }